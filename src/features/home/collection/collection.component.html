<!-- SECTION 3: OLFACTORY COLLECTIONS / CHAPTERS -->
<section class="w-full py-space-xxl bg-surface-container-low border-t border-border-hairline relative">
    <div class="xl:max-w-7xl mx-auto px-margin lg:px-margin-desktop">
        <div class="text-center  mx-auto mb-16">
            <span class="font-label-caps text-label-caps text-gold-antique uppercase tracking-[0.3em] block mb-space-xs">✦ <span class="text-gold-champagne">DISCOVER YOUR SCENT</span> ✦</span>
            <h2 class="font-display text-headline-lg max-md:text-[2.5rem]  text-cream-parchment mb-space-sm">World of Fragrances</h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-gutter-desktop">

            @for (chapter of chapters; track chapter.id) {
            <div class="relative group bg-surface border border-border-hairline overflow-hidden flex flex-col">

                <!-- Image -->
                <div class="h-80 w-full overflow-hidden relative">
                    <div class="w-full h-full bg-cover bg-center group-hover:scale-110 transition-transform duration-700" [style.background-image]="'url(' + chapter.image + ')'" [attr.aria-label]="chapter.alt" role="img">
                    </div>

                    <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/40 to-transparent"></div>

                    <span class="absolute top-6 left-6 font-label-caps text-label-caps tracking-widest text-gold-champagne uppercase border border-border-hairline px-3 py-1 bg-surface-dim/80">
                        {{ chapter.label }}
                    </span>
                </div>

                <!-- Content -->
                <div class="p-space-lg flex-1 flex flex-col justify-between">

                    <div>
                        <h3 class="font-headline-md text-headline-md text-cream-parchment mb-space-xs group-hover:text-gold-champagne transition-colors">
                            {{ chapter.title }}
                        </h3>

                        <p class="font-label-caps uppercase text-label-caps text-gold-champagne uppercase tracking-widest mb-space-md">
                            {{ chapter.notes }}
                        </p>

                        <p class="font-body-default text-body-default leading-5 text-on-surface-variant mb-space-lg">
                            {{ chapter.description }}
                        </p>
                    </div>

                    <!-- Footer -->
                    <div class="pt-space-md border-t border-border-hairline/60 flex items-center justify-between">

                        <span class="font-body-muted text-body-muted text-gold-champagne/90">
                            {{ chapter.compositions }} Compositions
                        </span>

                    </div>
                </div>
            </div>
            }

        </div>
    </div>
</section>
