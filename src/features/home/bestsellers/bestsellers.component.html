<section class="w-full py-space-xxl bg-surface relative" id="selection-privee">
  <div class="max-w-7xl mx-auto px-margin lg:px-margin-desktop">
    <!-- Section Header -->
    <div class="bg-surface flex flex-col md:flex-row md:items-end justify-between mb-space-xl pb-4">
      <div>
        <div class="flex items-center gap-space-xs mb-space-xs">
          <span class="text-gold-antique text-xs">✦</span>
          <span
            class="font-label-caps text-label-caps text-gold-champagne uppercase tracking-[0.25em]"
            >COLLECTION EXTRAORDINAIRE</span
          >
        </div>
        <h2 class="font-headline-lg text-headline-lg text-cream-parchment">Signature Scents</h2>
      </div>
    </div>

    <!-- Fragrance Cards Grid -->
    <!-- Carousel track (replaces the grid div) -->
    <div class="relative">
      <button
        aria-label="Previous fragrance"
        (click)="scroll(-1)"
        [disabled]="!canPrev()"
        class="absolute z-3 -left-4 top-1/2 w-10 h-10  backdrop-blur-3xl bg-emerald-elevated border rounded-full border-gold-antique/20 flex items-center justify-center text-gold-champagne hover:border-gold-antique hover:text-gold-shimmer transition-colors disabled:opacity-30 disabled:pointer-events-none"
      >
        <i class="fas fa-angle-left"></i>
      </button>
      <button
        aria-label="Next fragrance"
        (click)="scroll(1)"
        [disabled]="!canNext()"
        class="absolute z-3 -right-4 top-1/2 w-10 h-10 border backdrop-blur-3xl border-gold-antique/20 rounded-full flex items-center justify-center bg-emerald-elevated text-gold-champagne hover:border-gold-antique hover:text-gold-shimmer transition-colors disabled:opacity-30 disabled:pointer-events-none"
      >
        <i class="fas fa-angle-right"></i>
      </button>
      <div
        #track
        (scroll)="updateButtons()"
        class="flex overflow-x-auto snap-x snap-mandatory scroll-smooth [scrollbar-width:none] [&::-webkit-scrollbar]:hidden relative"
      >
        @for (product of products; track $index) {
          <!-- Slide wrapper: sets the width and spacing -->
          <div
            class="snap-start shrink-0 basis-full sm:basis-1/2 md:basis-1/3 lg:basis-1/4 px-2 flex"
          >
            <app-product-card class="block w-full" [product]="product" [compact]="false">
            </app-product-card>
          </div>
        }
      </div>
    </div>
  </div>
</section>
