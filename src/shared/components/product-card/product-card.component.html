<article class="group w-full bg-surface-container border-0 border-border-hairline hover:border-gold-antique/60 transition-all duration-500 flex flex-col justify-between hover:shadow-[0_12px_40px_rgba(10,45,36,0.6)]">

    <!-- Product Image -->
    <div class="relative w-full aspect-3/4 bg-surface-container-lowest overflow-hidden flex items-center justify-center p-6">

        <span class="absolute top-4 left-4 font-label-caps text-label-caps text-gold-champagne tracking-widest uppercase z-2">
            {{ product().number }}
        </span>

        <span class="absolute top-4 right-4 bg-emerald-elevated/80 border border-border-hairline px-2 py-0.5 font-label-caps text-[0.6rem] text-gold-shimmer tracking-wider z-2">
            {{ product().type }}
        </span>

        <img [src]="product().image" [alt]="product().name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-90 group-hover:opacity-100" />

        <div class="absolute inset-0 bg-linear-to-t from-surface-container via-transparent to-transparent z-2 opacity-80"></div>
    </div>

    <!-- Product Details -->
    <div class="p-space-md flex flex-col flex-1 justify-between">

        <div>
            <div class="flex justify-between items-baseline mb-space-xs">
                <span class="font-label-caps text-label-caps tracking-[0.2em] text-gold-champagne uppercase">
                    {{ product().category }}
                </span>

                <span class="font-label-price text-label-price text-gold-shimmer">
                    {{ product().price }}
                </span>
            </div>

            <h3 class="font-headline-sm text-headline-sm text-cream-parchment group-hover:text-gold-champagne transition-colors mb-space-xs">
                {{ product().name }}
            </h3>

            <p class="font-body-muted text-body-muted text-on-surface-variant mb-space-md line-clamp-2">
                {{ product().description }}
            </p>
        </div>

        <!-- Acquire Button -->
        <button class="mt-space-md w-full py-3 bg-surface-container-high hover:bg-gold-antique text-cream-parchment hover:text-surface-container-lowest border border-border-hairline hover:border-gold-antique font-label-caps text-label-caps uppercase tracking-[0.2em] transition-all duration-300 flex items-center justify-center gap-space-xs">

            <i class="fa fa-shopping-bag text-sm"></i>
            <span>Purchase Now</span>

        </button>
    </div>
</article>
