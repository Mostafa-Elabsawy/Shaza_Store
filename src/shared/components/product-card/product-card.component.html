<!-- Product Card -->
<article class="group flex h-full flex-col justify-between border border-border-hairline bg-emerald-surface shadow-[0_4px_20px_rgba(1,17,13,0.5)] transition-all duration-300 hover:border-gold-antique/60 hover:shadow-[0_8px_30px_rgba(212,175,55,0.12)]">
    <!-- Product Image -->
    <div class="relative aspect-4/5 w-full overflow-hidden bg-surface-container-lowest">
        <!-- Product Image -->
        <img [src]="product().image" [alt]="product().alt" loading="lazy" class="h-full w-full object-cover object-center transition-transform duration-700 group-hover:scale-105" />

        <!-- Wishlist Toggle -->
        <button type="button" (click)="toggleWishlist()" [attr.aria-pressed]="wishlisted()" [attr.aria-label]="'Toggle wishlist for ' + product().name" class="absolute right-2 top-2 z-2 grid size-9 place-items-center rounded-full border border-border-hairline bg-emerald-elevated  backdrop-blur-sm transition-colors hover:border-gold-antique lg:right-3 lg:top-3">
            <i class="fa fa-heart text-base leading-none" [class.text-gold-antique]="wishlisted()" [class.text-cream-parchment]="!wishlisted()"></i>
        </button>

        <!-- Product Badge -->
        @if (product().badge === 'Bestseller') {
        <div class="absolute left-2 top-2 border border-border-hairline bg-emerald-surface/90 px-space-sm py-1 font-label-caps text-label-caps uppercase tracking-widest text-gold-shimmer backdrop-blur-sm lg:left-3 lg:top-3">
            Bestseller
        </div>
        } @else if (product().badge === 'New Harvest') {
        <div class="absolute left-2 top-2 bg-secondary-fixed px-space-sm py-1 font-label-caps text-label-caps uppercase tracking-widest text-on-secondary-fixed lg:left-3 lg:top-3">
            New Harvest
        </div>
        }

        <!-- Quick Add Button -->
        <button type="button" (click)="quickAdd.emit(product().name)" class="max-sm:hidden absolute inset-x-0 bottom-0 translate-y-full border-t border-border-hairline bg-emerald-surface/95 py-space-sm text-center font-label-caps text-label-caps uppercase tracking-widest text-gold-shimmer backdrop-blur-md transition-transform duration-300 hover:bg-gold-antique hover:text-surface-container-lowest group-hover:translate-y-0 max-lg:translate-y-0">
            <span class="max-sm:hidden">Quick Acquisition • </span>
            <span class="sm:hidden">Add • </span>
            ${{ product().price }}
        </button>
    </div>

    <!-- Product Details -->
    <div class="flex flex-1 flex-col justify-between bg-linear-to-b from-emerald-surface to-surface-dim p-space-sm lg:p-space-md">
        <div>
            <!-- Product Concentration & Size -->
            <span class="block font-label-caps text-xs font-medium uppercase tracking-widest text-gold-champagne">
                <span [class]="compact() == true ? 'hidden' : 'inline'">Concentration • </span>{{ product().size }}ml
            </span>

            <!-- Product Name -->
            <h2 class="truncate font-headline-sm text-[clamp(1.35rem,2vw,2rem)] font-medium text-cream-parchment transition-colors group-hover:text-gold-shimmer">
                <a [routerLink]="['/shop', product().id]" class="capitalize">
                    {{ product().name }}
                </a>
            </h2>

            <!-- Product Price -->
            <span class="block font-label-price text-[clamp(1rem,1.9vw,1.5rem)] font-medium text-gold-antique">
                {{ product().price }} <span class="text-gold-antique text-xs font-normal">EGP</span>
            </span>

            <!-- Product Description -->
            <p class="mt-space-xs line-clamp-2 font-body-muted text-body-muted text-on-surface-variant" [class.hidden]="compact()">
                {{ product().note }}
            </p>
        </div>

        <!-- Purchase Button -->
        <button type="button" class="mt-space-sm lg:mt-space-md w-full py-3 bg-surface-container-high hover:bg-gold-antique text-cream-parchment hover:text-surface-container-lowest border border-border-hairline hover:border-gold-antique font-label-caps text-label-caps uppercase tracking-[0.2em] transition-all duration-300 flex items-center justify-center gap-space-xs">
            <i class="fa fa-shopping-bag text-sm"></i>
            <span>Purchase</span>
        </button>
    </div>
</article>
