<header class="fixed top-0 left-0 z-50 w-full bg-surface-container-low backdrop-blur-md">
  <!-- Main Navigation -->
  <div class="flex h-20 w-full items-center border-y border-gold-antique/50">
    <div class="mx-auto flex h-20 w-full max-w-7xl items-center justify-between px-3 sm:px-6">

      <!-- Mobile Menu Button -->
      <button type="button" (click)="toggleSideNavbarState()" aria-label="Open navigation menu"
        class="hidden max-lg:flex text-on-surface-variant transition-colors hover:text-gold-antique">
        <i class="fa fa-bars text-xl leading-none"></i>
      </button>

      <!-- Logo -->
      <a routerLink="/home" class="group flex h-full items-center">
        <img alt="SHAZA Fragrances" class="h-10 sm:h-12 object-contain" src="./Shaza.png" />
      </a>

      <!-- Navigation Links -->
      <nav class="hidden w-auto items-center gap-8 lg:flex m-1">
        <a class="nav-item" routerLink="/home" routerLinkActive="active">Home</a>
        <a class="nav-item" routerLink="/about" routerLinkActive="active">About</a>
        <a class="nav-item" routerLink="/shop" routerLinkActive="active">Shop</a>
        <a class="nav-item" routerLink="/contact" routerLinkActive="active">Contact</a>
      </nav>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-1 sm:gap-2 md:gap-3 lg:gap-4">

        <!-- Cart -->
        <a routerLink="/cart"
          class="flex items-center gap-1 p-1 text-on-surface-variant transition-colors hover:text-gold-champagne">
          <i class="fa fa-shopping-bag text-lg leading-none"></i>
          <span class="font-label-caps whitespace-nowrap text-label-caps tracking-widest uppercase">
            <span class="max-sm:hidden">Bag </span>(0)
          </span>
        </a>

        <!-- Wishlist -->
        <a routerLink="/wishlist"
          class="flex items-center gap-1 p-1 text-on-surface-variant transition-colors hover:text-gold-champagne">
          <i class="fa fa-heart text-lg leading-none"></i>
          <span class="font-label-caps whitespace-nowrap text-label-caps tracking-widest uppercase">
            <span class="max-sm:hidden">Wishlist </span>(0)
          </span>
        </a>

        @if (loginState()) {
          <!-- Account -->
          <button type="button" (click)="toggleLoginState()"
            class="group hidden lg:flex cursor-pointer items-center gap-2 rounded-xl border border-border-hairline/5 px-4 py-1.5 text-on-surface-variant transition-colors hover:border-gold-champagne hover:text-gold-champagne">
            <div class="flex h-8 w-8 items-center justify-center rounded-full border border-border-hairline/80 bg-emerald-surface text-on-surface-variant transition-colors group-hover:text-gold-champagne">
              <i class="fa fa-user text-[17px]"></i>
            </div>
            <span class="font-label-caps text-label-caps tracking-widest uppercase">Mostafa</span>
          </button>
        } @else {
          <!-- Authentication Buttons -->
          <div class="hidden gap-5 lg:flex">
            <button type="button" (click)="toggleLoginState()"
              class="cursor-pointer whitespace-nowrap border border-gold-antique/40 px-6 py-4 font-interface text-label-caps text-gold-shimmer uppercase transition-all duration-300 hover:border-gold-antique hover:bg-emerald-surface">
              Log In
            </button>
            <button type="button" (click)="toggleLoginState()"
              class="cursor-pointer whitespace-nowrap bg-gold-antique px-6 py-4 font-interface text-label-caps text-surface-container-lowest uppercase shadow-lg transition-all duration-300 hover:bg-gold-shimmer hover:shadow-mint-luminous/10">
              Sign Up
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>

<!-- ===================== MOBILE OFF-CANVAS DRAWER ===================== -->
<div id="drawerBackdrop"
  (click)="sideNabarState.set(false)"
  class="fixed inset-0 z-90 bg-black/10 transition-opacity duration-300 lg:hidden"
  [ngClass]="sideNabarState()
    ? 'opacity-100 pointer-events-auto  backdrop-blur-sm'
    : 'opacity-0 pointer-events-none backdrop-blur-0'"></div>

<aside id="mobileDrawer" role="dialog" aria-modal="true" aria-label="Navigation menu"
  class="fixed  top-0 left-0 z-90 h-screen flex justify-between w-80 max-w-[85vw] flex-col overflow-y-auto border-r border-gold-antique bg-surface-container-lowest shadow-2xl transition-transform duration-300 ease-out lg:hidden"
  [ngClass]="sideNabarState() ? 'translate-x-0' : '-translate-x-full'">

  <!-- Brand Header -->
  <div class="flex shrink-0 items-center justify-between border-b border-border-hairline bg-surface-dim px-6 py-5">
    <a routerLink="/home" (click)="sideNabarState.set(false)" class="flex h-full items-center">
      <img alt="SHAZA Fragrances" class="h-10 sm:h-12 object-contain" src="./Shaza.png" />
    </a>
    <button type="button" id="closeDrawerBtn" (click)="sideNabarState.set(false)" aria-label="Close navigation menu"
      class="flex items-center justify-center rounded-full border border-border-hairline p-2 text-outline transition hover:bg-surface-container hover:text-gold-antique focus:outline-none">
      <i class="fa fa-xmark text-[18px] leading-none"></i>
    </button>
  </div>

  <!-- Main Navigation -->
  <nav class=" flex-1 space-y-1.5 px-4 py-5">
    <a class="side-nav-item" routerLink="/home" routerLinkActive="active" (click)="sideNabarState.set(false)">Home</a>
    <a class="side-nav-item" routerLink="/about" routerLinkActive="active" (click)="sideNabarState.set(false)">About</a>
    <a class="side-nav-item" routerLink="/shop" routerLinkActive="active" (click)="sideNabarState.set(false)">Shop</a>
    <a class="side-nav-item" routerLink="/contact" routerLinkActive="active" (click)="sideNabarState.set(false)">Contact</a>
  </nav>

  <!-- Bottom Actions -->
  <div class="space-y-3 shrink-0 px-5 py-5">

    <!-- Bag -->
    <a routerLink="/cart" (click)="sideNabarState.set(false)"
      class="group flex w-full items-center justify-between rounded border border-on-surface-variant/30 bg-surface-container-lowest px-3.5 py-3 text-on-surface hover:border-border-hairline">
      <div class="flex items-center gap-3 group-hover:text-gold-antique">
        <i class="fa fa-shopping-bag text-lg leading-none"></i>
        <span class="font-label-caps text-label-caps font-medium uppercase tracking-[0.2em] text-cream-parchment group-hover:text-gold-antique">Bag</span>
      </div>
      <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-on-surface-variant px-1 text-[10px] font-bold text-surface-container-lowest group-hover:bg-gold-antique">0</span>
    </a>

    <!-- Wishlist -->
    <a routerLink="/wishlist" (click)="sideNabarState.set(false)"
      class="group flex w-full items-center justify-between rounded border border-on-surface-variant/30 bg-surface-container-lowest px-3.5 py-3 text-on-surface hover:border-border-hairline">
      <div class="flex items-center gap-3 group-hover:text-gold-antique">
        <i class="fa fa-heart text-lg leading-none"></i>
        <span class="font-label-caps text-label-caps font-medium uppercase tracking-[0.2em] text-cream-parchment group-hover:text-gold-antique">Wishlist</span>
      </div>
      <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-on-surface-variant px-1 text-[10px] font-bold text-surface-container-lowest group-hover:bg-gold-antique">0</span>
    </a>

    @if (loginState()) {
      <!-- User Account -->
      <button type="button" (click)="toggleLoginState()"
        class="group relative flex w-full cursor-pointer items-center gap-3.5 overflow-hidden border border-gold-antique/25 bg-surface-container px-4 py-3.5 text-left transition-all duration-300 hover:border-gold-antique/60 hover:bg-surface-container">
        <span class="absolute inset-y-0 left-0 w-0.5 bg-gold-antique"></span>
        <div class="flex size-11 shrink-0 items-center justify-center rounded-full border border-gold-antique/50 bg-surface-container-lowest text-gold-antique transition-colors duration-300 group-hover:bg-gold-antique group-hover:text-surface-container-lowest">
          <i class="fa fa-user text-base"></i>
        </div>
        <div class="min-w-0 flex-1">
          <span class="mb-1 block text-[9px] font-medium uppercase tracking-[0.22em] text-gold-antique">Welcome Back</span>
          <span class="block truncate font-label-caps text-xs font-semibold uppercase tracking-[0.16em] text-cream-parchment transition-colors group-hover:text-gold-champagne">Mostafa</span>
        </div>
      </button>
    } @else {
      <!-- Guest Account -->
      <div class="border border-border-hairline/70 bg-surface-container p-4">
        <div class="mb-3 flex items-center gap-3">
          <div class="flex size-10 shrink-0 items-center justify-center rounded-full border border-gold-antique/30 bg-emerald-surface text-gold-antique">
            <i class="fa fa-user text-base"></i>
          </div>
          <div class="min-w-0">
            <span class="block font-label-caps text-xs font-semibold uppercase tracking-[0.16em] text-cream-parchment">Welcome, Guest</span>
            <span class="mt-1 block text-[10px] text-on-surface-variant">Sign in to your account</span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" (click)="toggleLoginState()"
            class="flex cursor-pointer items-center justify-center border border-border-hairline px-3 py-2.5 font-label-caps text-[10px] font-medium uppercase tracking-[0.16em] text-cream-parchment transition-colors hover:border-gold-antique hover:text-gold-antique">
            Sign In
          </button>
          <button type="button" (click)="toggleLoginState()"
            class="flex cursor-pointer items-center justify-center bg-gold-antique px-3 py-2.5 font-label-caps text-[10px] font-semibold uppercase tracking-[0.16em] text-surface-container-lowest transition-colors hover:bg-gold-champagne">
            Register
          </button>
        </div>
      </div>
    }
  </div>
</aside>
